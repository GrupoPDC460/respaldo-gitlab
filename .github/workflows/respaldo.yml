name: Respaldo GitHub → GitLab

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: read

concurrency:
  group: respaldo-gitlab
  cancel-in-progress: false

jobs:
  espejo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar todos los repos de GrupoPDC460 a GitLab
        env:
          GL_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GL_GROUP: ${{ vars.GITLAB_GROUP }}
          GL_HOST: ${{ vars.GITLAB_HOST || 'gitlab.com' }}
          GH_OWNER: GrupoPDC460
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/espejo.sh
